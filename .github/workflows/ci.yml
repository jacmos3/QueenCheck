name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "ignition/**"
      - "scripts/**"
      - "!scripts/audit-runtime.mjs"
      - "!scripts/audit-runtime.test.mjs"
      - "app/**"
      - "hardhat.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "ignition/**"
      - "scripts/**"
      - "!scripts/audit-runtime.mjs"
      - "!scripts/audit-runtime.test.mjs"
      - "app/**"
      - "hardhat.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The deployment gate verifies that the exact deployed source commit
          # is an ancestor of HEAD. A depth-1 checkout cannot resolve it once
          # the signed deployment manifest is committed separately.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run check:abi
      - run: npm test
      - run: npm run check:size
      - run: npm --prefix app ci
      - run: npm --prefix app test
      - run: npm --prefix app run check
      - run: npm --prefix app run build
