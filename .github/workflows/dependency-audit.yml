name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "app/package.json"
      - "app/package-lock.json"
      - ".nvmrc"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/audit-runtime.mjs"
      - "scripts/audit-runtime.test.mjs"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "app/package.json"
      - "app/package-lock.json"
      - ".nvmrc"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/audit-runtime.mjs"
      - "scripts/audit-runtime.test.mjs"

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/audit-runtime.test.mjs
      - run: node scripts/audit-runtime.mjs
      - run: node ../scripts/audit-runtime.mjs
        working-directory: app
